name: CrewAI News Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 AM UTC

jobs:
  generate-news-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 💾 Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 📦 Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv venv .venv
        . .venv/bin/activate
        uv pip install -e .

    - name: 🤖 Execute CrewAI pipeline
      shell: bash
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        NEWS_TOPIC: "latest AI developments"
        VIRTUAL_ENV: .venv
        PATH: .venv/bin:$PATH
      run: |
        mkdir -p output
        python -m crewai run 2>/dev/null || python main.py 2>/dev/null
        
        # Verify markdown file was generated
        if [ ! -f "ai_news_report.md" ]; then
          echo "❌ Error: ai_news_report.md not generated"
          exit 1
        fi
        
        mv ai_news_report.md output/ai_news_report.md
        echo "✓ News report generated successfully"

    - name: 📊 Verify artifact content
      if: success()
      shell: bash
      run: |
        if [ -f "output/ai_news_report.md" ]; then
          echo "📄 Report size: $(wc -c < output/ai_news_report.md) bytes"
          echo "📋 Preview:"
          head -20 output/ai_news_report.md
        fi

    - name: 📤 Upload markdown artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ai-news-report-${{ github.run_number }}
        path: output/ai_news_report.md
        retention-days: 30
        if-no-files-found: error

    - name: ❌ Upload logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: pipeline-logs-${{ github.run_number }}
        path: output/
        retention-days: 7