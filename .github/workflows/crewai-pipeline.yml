name: CrewAI News Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 AM UTC


jobs:
  run-crew:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # Virtual machine environment
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4        # clone your repository’s code into the virtual machine that the workflow runs on.

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 💾 Cache uv virtualenv
      uses: actions/cache@v4
      with:
        path: .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 📦 Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: 🔧 Install dependencies
      run: |
        if [ ! -d ".venv" ]; then
          uv venv
        fi
        source .venv/bin/activate
        uv pip install -e .



    - name: 🤖 Run CrewAI
  env:
    GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
    NEWS_TOPIC: "latest AI developments"
  run: |
    set -e
    echo "Start time: $(date)"
    ls -la
    ls -la .venv || echo "❌ No .venv found!"
    source .venv/bin/activate
    which python
    which crewai || echo "❌ CrewAI not installed!"
    mkdir -p output
    echo "Running CrewAI..."
    # Change to your project directory if needed
    cd /path/to/your/crewai/project
    # Run CrewAI with proper log and output separation
    PYTHONUNBUFFERED=1 crewai run > >(tee /path/to/your/project/output/news_report.md) 2> >(tee /path/to/your/project/output/logs.txt >&2) || echo "❌ crewai run failed!"
    echo "End time: $(date)"
    echo ""
    echo "--- Logs Stored ---"
    if [ -f /path/to/your/project/output/logs.txt ]; then
      wc -l /path/to/your/project/output/logs.txt
    fi
    echo ""
    echo "--- Output Stored ---"
    if [ -f /path/to/your/project/output/news_report.md ]; then
      wc -l /path/to/your/project/output/news_report.md
    fi



    - name: 📤 Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: news-report-${{ github.run_number }}
        path: output/
        retention-days: 30