name: CrewAI News Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # Manual trigger via GitHub UI

jobs:
  run-crew:
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 💾 Cache uv virtualenv
      uses: actions/cache@v4
      with:
        path: .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 📦 Install uv
      shell: powershell
      run: |
        irm https://astral.sh/uv/install.ps1 | iex
        $env:Path += ";$HOME\.cargo\bin"
        Write-Host "✅ uv installed successfully."

    - name: 🔧 Install dependencies
      shell: powershell
      run: |
        if (-Not (Test-Path ".venv")) {
          uv venv
        }
        & .\.venv\Scripts\Activate.ps1
        uv pip install -e .
        Write-Host "✅ Dependencies installed."

    - name: 🤖 Run CrewAI
      shell: powershell
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        NEWS_TOPIC: "latest AI developments"
      run: |
        $ErrorActionPreference = "Stop"
        Write-Host "🚀 Starting CrewAI pipeline..."
        Write-Host "Start time: $(Get-Date)"
        Get-ChildItem -Force
        if (-Not (Test-Path ".venv")) { Write-Host "❌ No .venv found!" }

        & .\.venv\Scripts\Activate.ps1
        Get-Command python
        if (-Not (Get-Command crewai -ErrorAction SilentlyContinue)) {
          Write-Host "❌ CrewAI not found!"
        }

        New-Item -ItemType Directory -Force -Path output | Out-Null
        Write-Host "Running CrewAI..."

        try {
          # Stream output live to console AND save logs locally
          crewai run 2>&1 | Tee-Object -FilePath "output/logs.txt"

          # Optional: also save Markdown report separately if CrewAI writes to stdout
          # crewai run 2>&1 | Tee-Object -FilePath "output/news_report.md"
        }
        catch {
          Write-Host "❌ crewai run failed!"
        }

        Write-Host "End time: $(Get-Date)"


    - name: 📤 Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: news-report-${{ github.run_number }}
        path: output/
        retention-days: 30