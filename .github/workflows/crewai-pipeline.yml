name: CrewAI News Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 AM UTC

jobs:
  run-crew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: 🔧 Install dependencies
      run: |
        uv venv
        source .venv/bin/activate
        uv pip install -e .

    - name: 🤖 Run CrewAI
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        NEWS_TOPIC: "latest AI developments"
      run: |
        source .venv/bin/activate
        crewai run

    - name: 📤 Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: news-report-${{ github.run_number }}
        path: output/
        retention-days: 30

    - name: 📊 Summary
      if: always()
      run: |
        echo "## 🎉 CrewAI Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Pipeline completed!" >> $GITHUB_STEP_SUMMARY
        echo "📁 Check artifacts for the generated report" >> $GITHUB_STEP_SUMMARY