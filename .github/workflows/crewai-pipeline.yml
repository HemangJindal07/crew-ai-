env:
  PYTHON_VERSION: '3.11'
  TIMEOUT_MINUTES: 45

jobs:
  generate-news-report:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ env.TIMEOUT_MINUTES }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 💾 Cache uv virtualenv
      uses: actions/cache@v4
      with:
        path: .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 📦 Install uv package manager
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: 🔧 Install project dependencies
      run: |
        source $HOME/.cargo/env || true
        if [ ! -d ".venv" ]; then
          uv venv
        fi
        source .venv/bin/activate
        uv pip install -e .

    - name: 🤖 Execute CrewAI pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        NEWS_TOPIC: "latest AI developments"
      run: |
        source .venv/bin/activate
        mkdir -p output
        python -c "from crewai import Crew; crew = Crew(...); crew.kickoff()" > /dev/null 2>&1
        
        # Verify markdown file was generated
        if [ ! -f "ai_news_report.md" ]; then
          echo "Error: ai_news_report.md not generated"
          exit 1
        fi
        
        mv ai_news_report.md output/ai_news_report.md
        echo "✓ News report generated successfully"

    - name: 📊 Verify artifact content
      run: |
        if [ -f "output/ai_news_report.md" ]; then
          echo "📄 Report size: $(wc -c < output/ai_news_report.md) bytes"
          echo "📋 First 10 lines:"
          head -10 output/ai_news_report.md
        fi

    - name: 📤 Upload markdown artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ai-news-report-${{ github.run_number }}
        path: output/ai_news_report.md
        retention-days: 30
        if-no-files-found: error

    - name: ❌ Upload logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: pipeline-logs-${{ github.run_number }}
        path: output/
        retention-days: 7